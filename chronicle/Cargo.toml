[package]
name = "foundry-chronicle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A locked, hash-chained JSON event ledger with durable idempotent appends"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.16"
